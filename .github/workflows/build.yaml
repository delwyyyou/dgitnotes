name: Build Release GitNotes

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Test Keystore for Signing
        run: |
          keytool -genkeypair \
            -alias gitnotes-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ci-release.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=GitNotes CI, OU=Test, O=Delwy, L=Moscow, ST=Ru, C=RU"

      - name: Configure Signing Properties
        run: |
          echo "RELEASE_STORE_FILE=$(pwd)/ci-release.keystore" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=gitnotes-key" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitnotes-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
