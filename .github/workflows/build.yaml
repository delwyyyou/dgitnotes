name: Build Release GitNotes

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Test Keystore for Signing
        run: |
          keytool -genkeypair \
            -alias gitnotes-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ci-release.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=GitNotes CI, OU=Test, O=Delwy, L=Moscow, ST=Ru, C=RU"

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Find and Sign APK
        id: sign_apk
        run: |
          # Ищем любой apk в папке release (обычно это app-release-unsigned.apk)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          
          echo "Found unsigned APK: $UNSIGNED_APK"
          
          # Формируем имя для подписанного файла
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}.apk"
          if [ "$SIGNED_APK" = "$UNSIGNED_APK" ]; then
             SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"
          fi
          
          echo "Signing to: $SIGNED_APK"
          
          # Подписываем с помощью apksigner из build-tools
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ci-release.keystore \
            --ks-key-alias gitnotes-key \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
            
          # Проверяем подпись
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$SIGNED_APK"
          
          echo "signed_path=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitnotes-release-apk
          path: ${{ steps.sign_apk.outputs.signed_path }}
          retention-days: 30
          if-no-files-found: error
